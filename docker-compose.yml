services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-stack

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ${GCP_KEY_HOST_PATH}:/gcp/gcp-key.json:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LOG=${LITELLM_LOG}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - DATABASE_URL=${DATABASE_URL}
      - STORE_MODEL_IN_DB=True
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-stack

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=true
    depends_on:
      - litellm
    networks:
      - ai-stack

  usage-extractor:
    build: ./usage-extractor
    container_name: usage-extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - usage-data:/data
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DB_PATH=/data/usage.db
      - FETCH_INTERVAL_SECONDS=60
    depends_on:
      - litellm
    networks:
      - ai-stack

  mcp-server:
    build: ./mcp-server
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${GCP_KEY_HOST_PATH}:/gcp/gcp-key.json:ro
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - RAG_CORPUS_NAME=${RAG_CORPUS_NAME}
    networks:
      - ai-stack

  agent:
    build: ./agent
    container_name: agent
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ${GCP_KEY_HOST_PATH}:/gcp/gcp-key.json:ro
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_GENAI_USE_VERTEXAI=True
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_CLOUD_LOCATION=${GCP_LOCATION}
      - MCP_SERVER_URL=http://mcp-server:8080/mcp
      - AGENT_MODEL=gemini-2.5-flash
    depends_on:
      - mcp-server
    networks:
      - ai-stack

  rag-ingest:
    build: ./rag-ingest
    container_name: rag-ingest
    profiles:
      - bootstrap
    volumes:
      - ${GCP_KEY_HOST_PATH}:/gcp/gcp-key.json:ro
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GCS_BUCKET=${GCS_BUCKET}
      - RAG_CORPUS_NAME=${RAG_CORPUS_NAME}
      - RAG_CORPUS_DISPLAY_NAME=books-corpus 
    networks:
      - ai-stack

volumes:
  openwebui-data:
  postgres-data:
  usage-data:

networks:
  ai-stack:
    driver: bridge
